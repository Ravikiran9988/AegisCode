name: CI Test & Quality Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: pip check

      - name: Run Ruff Linter
        run: python -m ruff check backend/ frontend/ tests/

      - name: Run Complete Pytest Suite (Phases 1-5)
        env:
          LLM_PROVIDER: mock
          EXECUTION_BACKEND: local
          DATABASE_URL: sqlite:///./test_ci.db
        run: python -m pytest -v --cov=backend --cov-report=term-missing
