name: CI Test & Quality Suite

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AegisCode targets Python 3.12 (see pyproject.toml).
        python-version: ["3.12"]

    # CI must be deterministic: never depend on a hosted LLM, Ollama, Docker,
    # or the production Render database.
    env:
      ENV: test
      ENVIRONMENT: test
      EXECUTION_BACKEND: local
      USE_DOCKER_SANDBOX: "false"
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ci-test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      DATABASE_URL: sqlite:///./test_ci.db
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall backend frontend

      - name: Run Ruff linter
        run: python -m ruff check backend/ frontend/ tests/

      - name: Run complete Pytest suite
        run: python -m pytest -q --cov=backend --cov-report=term-missing
