name: CI Test & Quality Suite

on:
  push:
    branches: [ main, master, dev, fix/guest-access-copy ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: pip check

      - name: Run Ruff Linter
        run: python -m ruff check backend/ frontend/ tests/

      - name: Run Complete Pytest Suite (Phases 1-5)
        env:
          EXECUTION_BACKEND: local
          DATABASE_URL: sqlite:///./test_ci.db
        run: python -m pytest -v --cov=backend --cov-report=term-missing

      - name: Apply guest access copy fix
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("frontend/components/landing.py")
          text = p.read_text(encoding="utf-8")
          old = "Instant guest access available &bull; No credit card required"
          new = "Instant guest access &bull; No signup required"
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          if git diff --quiet -- frontend/components/landing.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/landing.py
          git commit -m "fix: clarify guest access copy"
          git push
