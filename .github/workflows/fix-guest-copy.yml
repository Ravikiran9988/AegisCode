name: Update guest access copy

on:
  push:
    branches:
      - fix/guest-access-copy

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update guest access copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("frontend/components/landing.py")
          text = p.read_text(encoding="utf-8")
          old = "Instant guest access available &bull; No credit card required"
          new = "Instant guest access &bull; No signup required"
          if old not in text:
              raise SystemExit("Expected guest access copy was not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/landing.py
          git commit -m "fix: clarify guest access copy"
          git push
