version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fixsembly_postgres
    environment:
      POSTGRES_USER: fixsembly_user
      POSTGRES_PASSWORD: fixsembly_password
      POSTGRES_DB: fixsembly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixsembly_user -d fixsembly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixsembly_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://fixsembly_user:fixsembly_password@postgres:5432/fixsembly_db
      - LLM_PROVIDER=mock
      - EXECUTION_BACKEND=local
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8501
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./workspaces:/app/workspaces

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fixsembly_frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
