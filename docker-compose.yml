version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegiscode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegiscode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://aegis_user:aegis_password@postgres:5432/aegiscode_db
      - LLM_PROVIDER=mock
      - EXECUTION_BACKEND=local
      - CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./workspaces:/app/workspaces

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegis_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
