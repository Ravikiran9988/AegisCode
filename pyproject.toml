[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Existing codebase intentionally keeps some legacy formatting patterns.
# Keep CI focused on actionable correctness/import issues rather than requiring
# a large formatting-only rewrite of the existing application.
ignore = ["B008", "E501", "E702", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
