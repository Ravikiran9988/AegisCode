[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017"]  # FastAPI Depends() in defaults; UP017 forces Python 3.11+ datetime.UTC

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
