<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Fixsembly | Three Agents. One Verified Fix.</title>
    <meta name="title" content="Fixsembly: Three Agents. One Verified Fix." />
    <meta name="description" content="Self-Healing Multi-Agent Software Engineering System. Fixsembly analyzes failing Python projects, repairs code, executes Pytest and verifies fixes. Red to green, automatically." />
    <meta name="theme-color" content="#f8fafc" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fixsembly: Three Agents. One Verified Fix." />
    <meta property="og:description" content="Self-Healing Multi-Agent Software Engineering System. Red to green, automatically." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="Fixsembly: Three Agents. One Verified Fix." />
    <meta property="twitter:description" content="Self-Healing Multi-Agent Software Engineering System. Red to green, automatically." />
    <meta property="twitter:image" content="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Apply the saved theme before React renders to prevent a flash.
         Existing browsers are migrated from the old dark default to light once. -->
    <script>
      (function() {
        function applyTheme(theme) {
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme !== 'dark');
          root.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        }

        try {
          var versionKey = 'fixsembly_theme_version';
          var themeKey = 'fixsembly_theme';
          var version = localStorage.getItem(versionKey);
          var theme;

          if (version !== '2') {
            theme = 'light';
            localStorage.setItem(themeKey, theme);
            localStorage.setItem(versionKey, '2');
          } else {
            theme = localStorage.getItem(themeKey) || 'light';
          }

          applyTheme(theme);
        } catch (e) {
          applyTheme('light');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500/30 selection:text-brand-200 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
