services:
  # ── Fixsembly V2 API Backend ────────────────────────────────────────────────
  - type: web
    name: fixsembly-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    disk:
      name: fixsembly-workspaces
      mountPath: /app/workspaces
      sizeGB: 10
    envVars:
      - key: APP_NAME
        value: Fixsembly
      - key: ENV
        value: production
      - key: EXECUTION_BACKEND
        value: local
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: fixsembly-db
          property: connectionString
      - key: WORKSPACE_BASE_DIR
        value: /app/workspaces
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://fixsembly.com,https://www.fixsembly.com,http://localhost:5173"

  # ── Fixsembly V2 React Frontend (Static Site) ───────────────────────────────
  - type: web
    name: fixsembly-frontend
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: fixsembly-backend
          property: host

databases:
  - name: fixsembly-db
    region: oregon
    plan: basic
    databaseName: fixsembly
    user: fixsembly
